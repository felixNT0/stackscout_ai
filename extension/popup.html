<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #status {
      font-size: 12px;
      margin-bottom: 12px;
      font-weight: 500;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #applyBtn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    #openAppBtn {
      background: #f3f4f6;
      color: #374151;
    }
    button:hover:not(:disabled) {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>StackScout AI</h1>
  <div id="status">Checking...</div>
  <button id="applyBtn" disabled>Apply with StackScout AI</button>
  <button id="openAppBtn">Open StackScout AI</button>
  <script src="popup.js"></script>
</body>
</html>
